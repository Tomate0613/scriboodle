name: "build project"

inputs:
  github_token:
    description: "GitHub token for Nix fetches"
    required: false

runs:
  using: "composite"

  steps:
    - name: setup jdk
      uses: actions/setup-java@v5
      with:
        java-version: "25"
        distribution: "microsoft"

    - name: validate gradle wrapper
      uses: gradle/actions/wrapper-validation@v5

    - name: run build script
      run: ./gradlew build
      shell: bash
